COM_SERVICEDIRECTORY_COMPANY_NOTE_PORTFOLIO_DESCRIPTION="<section>	<h2>Portfolio</h2>	<p>		The <strong>Portfolio</strong> section lets your company showcase real examples of your work, projects, or past		engagements that demonstrate your expertise and service quality. Use it to highlight what you did, how you did it,		and the results you delivered. A strong portfolio builds trust, proves credibility, and helps your listing stand out.	</p>	<p><strong>Include details such as:</strong></p>	<ul>		<li><strong>Project title</strong> and a short description</li>		<li><strong>Industry / Sector</strong> that this project mainly targets</li>		<li><strong>Services Provided</strong> and technologies and tools used for the development of this project</li>		<li><strong>Links</strong> to live work or downloadable case studies</li>		<li><strong>Project Description</strong> to provide details and information about this project such as:			<ul>				<li>Development Strategy</li>				<li>Tools Used</li>				<li>Teams Involved</li>				<li>Project Timeline</li>				<li>Project Accomplishments</li>			</ul>		</li>	</ul>	<p>		<em>Tip: Feature 3–6 of your best projects and keep descriptions clear and results-focused.</em>	</p></section>"
